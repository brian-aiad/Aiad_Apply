name: quality

on:
  push:
  pull_request:

jobs:
  engine-quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install LibreOffice on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install libreoffice-fresh --no-progress -y

      - name: Install LibreOffice on macOS
        if: runner.os == 'macOS'
        run: brew install --cask libreoffice

      - run: uv sync --extra dev --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy packages/resume-engine/src
      - run: uv run pytest

      - name: Validate Windows launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts\*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($failed) { throw "PowerShell launcher syntax validation failed." }

      - name: Validate macOS launchers
        if: runner.os == 'macOS'
        run: >-
          bash -n scripts/start-local.sh scripts/stop-local.sh
          scripts/start-linkedin-review.sh "Start AiadApply.command"
          "Stop AiadApply.command"

  dashboard-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aiadapply
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/aiadapply
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: bash -n ../../scripts/start-local.sh ../../scripts/stop-local.sh
      - run: npm run build
